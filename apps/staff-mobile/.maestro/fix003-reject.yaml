# Valeria booked a paid Evaluation and attached a receipt. Paola rejects
# the transfer. The Evaluation is cancelled and the Payment stays rejected.
appId: ${APP_ID}
env:
  EMAIL: paola.mendoza@example.com
  PAYMENT_ID: 61bc5cd1-d727-4f1f-ae24-33154be99ac1
  APP_LINK: emmapilates-staff://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8186
---
- launchApp:
    appId: ${APP_ID}
    clearKeychain: true
- openLink: ${APP_LINK}
- repeat:
    times: 6
    while:
      notVisible:
        id: "login-email"
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 15000
          optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "login-email"
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          notVisible:
            id: "login-submit"
          timeout: 6000
          optional: true
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: subflows/dismiss-push-permission.yaml
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "pending-payment-${PAYMENT_ID}"
    timeout: 30000
- takeScreenshot: fix003-reject-pending
- tapOn:
    id: "pending-payment-${PAYMENT_ID}"
- extendedWaitUntil:
    visible: "Revisar pago"
    timeout: 20000
- swipe:
    start: "50%,70%"
    end: "50%,30%"
- extendedWaitUntil:
    visible:
      id: "review-reject"
    timeout: 10000
- tapOn:
    id: "review-reject"
- extendedWaitUntil:
    visible:
      id: "review-reject-reason"
    timeout: 10000
- tapOn:
    id: "review-reject-reason"
- waitForAnimationToEnd
- inputText: "El monto no coincide con la transferencia."
- tapOn:
    text: "Hide keyboard"
    optional: true
- swipe:
    start: "50%,42%"
    end: "50%,16%"
    duration: 700
- swipe:
    start: "50%,42%"
    end: "50%,16%"
    duration: 700
- swipe:
    start: "50%,42%"
    end: "50%,16%"
    duration: 700
- takeScreenshot: fix003-reject-reason
- tapOn:
    id: "review-reject-confirm"
- extendedWaitUntil:
    notVisible:
      id: "pending-payment-${PAYMENT_ID}"
    timeout: 20000
- takeScreenshot: fix003-reject-done
