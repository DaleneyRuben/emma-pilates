# Critical journey: the Administrator lands on Pagos pendientes and opens the
# Session cancellation search without changing anything.
appId: ${APP_ID}
env:
  EMAIL: paola.mendoza@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "Pagos pendientes"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- extendedWaitUntil:
    visible:
      text: "Por confirmar.*|Todo al día"
    timeout: 20000
- takeScreenshot: staff-admin-payments
- tapOn:
    id: "pending-payments-cancel-class"
- extendedWaitUntil:
    visible:
      text: "Sucursal: .*"
    timeout: 20000
- tapOn:
    text: "Sucursal: .*"
- tapOn: "Todas las sucursales"
- extendedWaitUntil:
    visible:
      text: "Sucursal: Todas las sucursales"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*(Centro|Equipetrol|Urubó).*|.*no hay clases.*|Este día no hay clases"
    timeout: 15000
- takeScreenshot: staff-admin-every-branch
