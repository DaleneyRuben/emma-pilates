# Critical journey: the Administrator lands on Pagos pendientes and opens the
# Session cancellation search without changing anything.
appId: ${APP_ID}
env:
  EMAIL: paola.mendoza@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "Pagos pendientes"
    timeout: 30000
# Expo Go's floating dev-menu gear covers the top-right corner («Tu cuenta»,
# «+ Nuevo horario» on the iPad): park it bottom-right before the first tap.
# A development build has no gear, so the step is skipped there.
- runFlow:
    when:
      visible:
        id: "gearshape.fill"
    commands:
      - swipe:
          from:
            id: "gearshape.fill"
          direction: DOWN
          duration: 600
- extendedWaitUntil:
    visible:
      text: "Por confirmar|No hay pagos pendientes."
    timeout: 20000
- takeScreenshot: staff-admin-payments
- tapOn: "Cancelar una clase"
- extendedWaitUntil:
    visible:
      text: "Sucursal: .*"
    timeout: 20000
- tapOn:
    text: "Sucursal: .*"
- tapOn: "Todas las sucursales"
- extendedWaitUntil:
    visible:
      text: "Sucursal: Todas las sucursales"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".* · (Centro|Equipetrol|Urubó)|No hay clases con estos filtros."
    timeout: 15000
- takeScreenshot: staff-admin-every-branch
