# Mariana has no Plan. The Assistant opens the cash sale and the 8-class Plan
# shows the founder price (Bs 476) with the list price (Bs 560) struck through.
# The price is drawn text: assertVisible matches the digits, and the
# screenshot is the proof a person reads.
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
  CLIENT: Mariana
---
- launchApp:
    appId: ${APP_ID}
    clearKeychain: true
- openLink: ${APP_LINK}
- repeat:
    times: 6
    while:
      notVisible:
        id: "login-email"
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 15000
          optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "login-email"
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          notVisible:
            id: "login-submit"
          timeout: 6000
          optional: true
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: subflows/dismiss-push-permission.yaml
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "client-search-input"
    timeout: 30000
- tapOn:
    id: "client-search-input"
- waitForAnimationToEnd
- inputText: ${CLIENT}
- extendedWaitUntil:
    visible:
      id: "client-result-.*"
    timeout: 15000
- tapOn:
    id: "client-result-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "client-overview-cash-payment"
    timeout: 20000
- takeScreenshot: fix227-cash-overview
- tapOn:
    id: "client-overview-cash-payment"
- extendedWaitUntil:
    visible: "Paquete de 8 clases"
    timeout: 20000
# The price is drawn text, so VoiceOver and Maestro cannot read 476 or 560.
# The screenshot is the proof: Bs 560 struck through, Bs 476 beside it.
- takeScreenshot: fix227-cash-founder-price
- tapOn: "Paquete de 8 clases"
- extendedWaitUntil:
    visible: "Confirmar pago en efectivo"
    timeout: 15000
- swipe:
    start: "50%,70%"
    end: "50%,25%"
- swipe:
    start: "50%,70%"
    end: "50%,25%"
- extendedWaitUntil:
    visible:
      id: "cash-confirm"
    timeout: 15000
- takeScreenshot: fix227-cash-confirm
- tapOn:
    id: "cash-confirm"
- extendedWaitUntil:
    visible: "Cobrado en efectivo: .*"
    timeout: 20000
- takeScreenshot: fix227-cash-recorded
