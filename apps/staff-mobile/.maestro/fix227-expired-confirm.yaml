# Lucía's Purchase Intent was back-dated and the worker expired it. The
# Assistant then recorded the studio QR at the front desk. The Administrator
# confirms that pending transfer and the founder place stays assigned.
appId: ${APP_ID}
env:
  EMAIL: paola.mendoza@example.com
  PAYMENT_ID: ${PAYMENT_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearKeychain: true
- openLink: ${APP_LINK}
- repeat:
    times: 6
    while:
      notVisible:
        id: "login-email"
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 15000
          optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "login-email"
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          notVisible:
            id: "login-submit"
          timeout: 6000
          optional: true
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: subflows/dismiss-push-permission.yaml
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "pending-payment-${PAYMENT_ID}"
    timeout: 30000
- takeScreenshot: fix227-expired-pending
- tapOn:
    id: "pending-payment-${PAYMENT_ID}"
- extendedWaitUntil:
    visible: "Revisar pago"
    timeout: 20000
- takeScreenshot: fix227-expired-review
- swipe:
    start: "50%,70%"
    end: "50%,25%"
- swipe:
    start: "50%,70%"
    end: "50%,25%"
- extendedWaitUntil:
    visible:
      id: "review-confirm"
    timeout: 15000
- takeScreenshot: fix227-expired-actions
- tapOn:
    id: "review-confirm"
- extendedWaitUntil:
    visible:
      id: "pending-payments-cancel-class"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "pending-payment-${PAYMENT_ID}"
    timeout: 15000
- takeScreenshot: fix227-expired-confirmed
