# Critical journey (MOB-073, finding 111): the Trainer opens «Mis pagos»,
# reads the summary and «Historial», and opens a statement. Fresh fixtures
# may hold no statement yet, so the flow accepts the empty state; with one,
# it opens the newest statement and one concept's classes by day.
appId: ${APP_ID}
env:
  EMAIL: emma.vargas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    id: "tab-pay"
- extendedWaitUntil:
    visible:
      text: "Historial|Otros pagos|Todavía no tienes pagos"
    timeout: 15000
- takeScreenshot: mob073-mis-pagos
- runFlow:
    when:
      visible: "Historial"
    commands:
      - tapOn:
          id: "pay-history-row"
      - extendedWaitUntil:
          visible:
            id: "pay-statement"
          timeout: 10000
      - takeScreenshot: fix111-liquidacion
      # BKO-008: the payment strip sits near the top, before the classes
      # unfold; a receipt opens full screen.
      - runFlow:
          when:
            visible: "Ver el comprobante del pago.*"
          commands:
            - tapOn: "Ver el comprobante del pago.*"
            - extendedWaitUntil:
                visible: "Pago del .*"
                timeout: 15000
            - takeScreenshot: bko008-comprobante
            - tapOn: "Cerrar"
            - assertVisible:
                id: "pay-statement"
      # E2 B (owner 2026-11-19): each concept opens its classes by day.
      - tapOn:
          id: "pay-group-row"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "pay-group"
          timeout: 10000
      - takeScreenshot: e2-concepto-por-dia
      - tapOn: "Volver"
      - assertVisible:
          id: "pay-statement"
      - tapOn: "Volver"
      - assertVisible: "Historial"
