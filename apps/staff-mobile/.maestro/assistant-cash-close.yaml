# Critical journey: at the end of the day the Assistant counts the drawer and
# closes Centro's cash (S25, BKO-003). It runs after
# assistant-cash-payment-and-booking, so the day has a cash sale; a Branch
# closes once a day, so a second run the same day opens on «Caja cerrada».
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
---
- runFlow: subflows/login.yaml
- runFlow: subflows/park-dev-gear.yaml
- extendedWaitUntil:
    visible:
      id: "tab-cash"
    timeout: 30000
- tapOn:
    id: "tab-cash"
- extendedWaitUntil:
    visible: "¿Cuánto efectivo hay en la caja.*|Hoy no hubo pagos en efectivo|Caja cerrada"
    timeout: 15000
# FIX-083 (pick C): a day without cash opens on the calm empty state; count
# anyway, so the flow still exercises the count.
- runFlow:
    when:
      visible: "Hoy no hubo pagos en efectivo"
    commands:
      - takeScreenshot: staff-cash-close-0-no-cash
      - tapOn:
          id: "cash-close-has-cash"
- runFlow:
    when:
      visible:
        id: "cash-close-counted"
    commands:
      - takeScreenshot: staff-cash-close-1-form
      - tapOn:
          id: "cash-close-counted"
      - waitForAnimationToEnd
      - inputText: "100"
      - extendedWaitUntil:
          visible: "Diferencia.*"
          timeout: 5000
      - runFlow:
          when:
            visible:
              id: "cash-close-note"
          commands:
            - tapOn:
                id: "cash-close-note"
            - waitForAnimationToEnd
            - inputText: "Prueba de cierre"
      - hideKeyboard
      - takeScreenshot: staff-cash-close-2-counted
      - scrollUntilVisible:
          element:
            id: "cash-close-submit"
          direction: DOWN
      - tapOn:
          id: "cash-close-submit"
      # FIX-083 (pick A): a close cannot be undone, so it asks once more.
      - extendedWaitUntil:
          visible:
            id: "cash-close-confirm"
          timeout: 5000
      - takeScreenshot: staff-cash-close-2b-confirm
      - tapOn:
          id: "cash-close-confirm"
- extendedWaitUntil:
    visible: "Caja cerrada"
    timeout: 15000
- assertVisible: "La cerró .*"
- takeScreenshot: staff-cash-close-3-closed
