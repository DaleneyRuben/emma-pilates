# Critical journey (FIX-041): a Staff Member sets and removes her own photo
# on Perfil, and sees a Client's photo where she appears (finding n.º 30).
# Needs the worker running and an image in the device's photo library
# (`xcrun simctl addmedia <udid> photo.jpg`, or `adb push` on Android), and
# Lucía with a photo (Test 134 G).
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    id: "client-search-input"
- inputText: "Lucía"
- extendedWaitUntil:
    visible: "Foto de Lucía Fernández"
    timeout: 20000
- takeScreenshot: fix041-staff-1-client-face
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Cambiar foto"
    timeout: 15000
- assertVisible: "Tu nombre y tu correo los actualiza administración."
- assertNotVisible: "Quitar foto"
- takeScreenshot: fix041-staff-2-perfil-initials
- tapOn: "Cambiar foto"
- runFlow: subflows/pick-first-photo.yaml
- extendedWaitUntil:
    visible: "Quitar foto"
    timeout: 60000
- assertVisible: "Foto de Camila Rojas"
- assertNotVisible: "Se recorta.*"
- takeScreenshot: fix041-staff-3-perfil-photo
- tapOn: "Quitar foto"
- extendedWaitUntil:
    notVisible: "Quitar foto"
    timeout: 20000
- assertNotVisible: "Foto de Camila Rojas"
- takeScreenshot: fix041-staff-4-perfil-removed
