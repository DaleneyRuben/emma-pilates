# Critical journey: the Assistant finds a Client and opens her overview.
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "Tu cuenta.*"
    timeout: 30000
# Expo Go's floating dev-menu gear covers the top-right corner («Tu cuenta»,
# «+ Nuevo horario» on the iPad): park it bottom-right before the first tap.
# A development build has no gear, so the step is skipped there.
- runFlow:
    when:
      visible:
        id: "gearshape.fill"
    commands:
      - swipe:
          from:
            id: "gearshape.fill"
          direction: DOWN
          duration: 600
- tapOn: "Buscar por nombre, teléfono o correo"
- inputText: "Lucía"
- extendedWaitUntil:
    visible:
      text: ".*Lucía Fernández.*"
    timeout: 15000
- tapOn:
    text: ".*Lucía Fernández.*"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Historial.*|Reservas.*"
    timeout: 15000
- takeScreenshot: staff-assistant-overview
