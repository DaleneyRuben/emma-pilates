# Critical journey: a Trainer sends «Envíanos tu opinión» from Perfil
# (REL-012, Prompt S27). Each run stores one Feedback; the API takes ten per
# Account in 24 hours.
appId: ${APP_ID}
env:
  EMAIL: emma.vargas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Cambiar foto"
    timeout: 15000
# Follow-up 293: «Ayuda» sits below the fold; «Preguntas frecuentes» is its last row.
- scrollUntilVisible:
    element: "Preguntas frecuentes"
    direction: DOWN
- tapOn: "Envíanos tu opinión"
- extendedWaitUntil:
    visible: "Cuéntanos qué falló o qué mejorarías.*"
    timeout: 15000
- tapOn: "Sugerencia"
- tapOn:
    id: "feedback-text"
- waitForAnimationToEnd
- inputText: "Sería útil ver la lista de la clase siguiente."
- hideKeyboard
- takeScreenshot: staff-feedback-1-listo
- tapOn: "Enviar comentario"
- extendedWaitUntil:
    visible: "¡Gracias por tu comentario!"
    timeout: 15000
- takeScreenshot: staff-feedback-2-enviado
- tapOn: "Volver al perfil"
- extendedWaitUntil:
    visible: "Preguntas frecuentes"
    timeout: 15000
