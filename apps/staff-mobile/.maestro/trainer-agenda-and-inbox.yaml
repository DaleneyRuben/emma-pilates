# Critical journey: the Trainer sees Mi agenda and reaches the inbox and Perfil.
appId: ${APP_ID}
env:
  EMAIL: emma.vargas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "Tu cuenta.*"
    timeout: 30000
# Expo Go's floating dev-menu gear covers the top-right corner («Tu cuenta»,
# «+ Nuevo horario» on the iPad): park it bottom-right before the first tap.
# A development build has no gear, so the step is skipped there.
- runFlow:
    when:
      visible:
        id: "gearshape.fill"
    commands:
      - swipe:
          from:
            id: "gearshape.fill"
          direction: DOWN
          duration: 600
- extendedWaitUntil:
    visible:
      text: "No tienes clases este día.|.*Pilates"
    timeout: 15000
- takeScreenshot: staff-trainer-agenda
- tapOn: "Tu cuenta.*"
- extendedWaitUntil:
    visible:
      text: "Notificaciones.*"
    timeout: 15000
- tapOn:
    text: "Notificaciones.*"
- extendedWaitUntil:
    visible:
      text: "Sin leer|Anteriores|No tienes notificaciones."
    timeout: 15000
