# Critical journey: the Trainer sees Mi agenda and reaches the inbox and Perfil.
appId: ${APP_ID}
env:
  EMAIL: emma.vargas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- extendedWaitUntil:
    visible:
      text: "Hoy no tienes clases|.* no tienes clases|.*Pilates"
    timeout: 15000
- takeScreenshot: staff-trainer-agenda
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      text: "Notificaciones.*"
    timeout: 15000
- tapOn:
    text: "Notificaciones.*"
# FIX-083: one grouped list, or the empty state.
- extendedWaitUntil:
    visible:
      id: "notifications-scroll"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "notifications-scroll"
    commands:
      - assertVisible: "No tienes notificaciones.*"
