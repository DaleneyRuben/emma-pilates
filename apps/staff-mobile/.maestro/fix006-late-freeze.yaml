# Mariana asked to freeze a quarterly Plan. The start was back-dated on a
# disposable copy so the approval arrives after it began. Approving changes
# nothing and tells Paola to refuse it.
appId: ${APP_ID}
env:
  EMAIL: paola.mendoza@example.com
  APP_LINK: emmapilates-staff://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8186
---
- launchApp:
    appId: ${APP_ID}
    clearKeychain: true
- openLink: ${APP_LINK}
- repeat:
    times: 6
    while:
      notVisible:
        id: "login-email"
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 15000
          optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "login-email"
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          notVisible:
            id: "login-submit"
          timeout: 6000
          optional: true
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: subflows/dismiss-push-permission.yaml
- runFlow: subflows/park-dev-gear.yaml
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    id: "account-avatar"
- extendedWaitUntil:
    visible: "Notificaciones.*"
    timeout: 15000
- tapOn: "Notificaciones.*"
- extendedWaitUntil:
    visible: ".*[Cc]ongelamiento.*"
    timeout: 20000
- takeScreenshot: fix006-late-inbox
- tapOn: ".*[Cc]ongelamiento.*"
- extendedWaitUntil:
    visible: "Aprobar"
    timeout: 20000
- takeScreenshot: fix006-late-review
- tapOn: "Aprobar"
- extendedWaitUntil:
    visible: "El congelamiento ya empezó.*"
    timeout: 15000
- takeScreenshot: fix006-late-refused
