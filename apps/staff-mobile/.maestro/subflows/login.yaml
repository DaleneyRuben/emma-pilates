# Opens the app through ${APP_LINK} (Expo Go or a development build) and logs
# in as ${EMAIL} with the shared development-fixture password.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn:
    id: "login-email"
# The iPad drops text typed before the keyboard has settled.
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          notVisible:
            id: "login-submit"
          timeout: 6000
          optional: true
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: dismiss-push-permission.yaml
