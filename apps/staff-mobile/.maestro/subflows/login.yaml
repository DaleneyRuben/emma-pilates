# Opens the app through ${APP_LINK} (Expo Go or a development build) and logs
# in as ${EMAIL} with the shared development-fixture password.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearKeychain: true
    clearState: true
- openLink: ${APP_LINK}
- extendedWaitUntil:
    visible:
      text: "Continue|Iniciar sesión"
    timeout: 180000
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Reload"
    timeout: 10000
    optional: true
- tapOn:
    point: "50%,25%"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 90000
- tapOn: "tu@emmapilates.bo"
- inputText: ${EMAIL}
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- repeat:
    times: 3
    while:
      visible: "Iniciar sesión"
    commands:
      - tapOn:
          text: "Iniciar sesión"
          index: 0
      - extendedWaitUntil:
          notVisible: "Iniciar sesión"
          timeout: 6000
          optional: true
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
