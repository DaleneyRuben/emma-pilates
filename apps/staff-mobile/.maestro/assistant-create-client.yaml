# Critical journey: the Assistant creates a Client's account (S05) and lands
# on her overview with the invitation pending (S06). The email is new on
# every run (scripts/seed.js «new-client»), so the flow can repeat on the same
# database; each run leaves one more pending invitation. The phone goes in
# without +591 and the overview shows it stored with it and its flag
# (FIX-036, FIX-037); it is a real Bolivian mobile that starts with 5, which
# libphonenumber knows (Test 197).
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
---
- runScript:
    file: scripts/seed.js
    env:
      SEED: new-client
- runFlow: subflows/login.yaml
# Test 195: the Face ID offer after login covers the screen.
- tapOn:
    text: "Ahora no"
    optional: true
- waitForAnimationToEnd
- runFlow: subflows/park-dev-gear.yaml
- extendedWaitUntil:
    visible:
      id: "client-search-new-client"
    timeout: 30000
# The first tap after the Face ID sheet closes can be swallowed.
- repeat:
    times: 3
    while:
      notVisible:
        id: "new-client-name"
    commands:
      - tapOn:
          id: "client-search-new-client"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-client-name"
          timeout: 5000
          optional: true
- assertVisible:
    id: "new-client-name"
- tapOn:
    id: "new-client-name"
- waitForAnimationToEnd
- inputText: "Paula Maestro"
# The phone pad has no return key: type the phone first and close the
# email keyboard with its return key, so it never covers «Crear cuenta».
- tapOn:
    id: "new-client-phone"
- waitForAnimationToEnd
- inputText: "57007684"
- tapOn:
    id: "new-client-email"
- waitForAnimationToEnd
- inputText: ${output.email}
- pressKey: Enter
# BKM-011: «¿Cómo nos conociste?» is required (follow-up 141).
- scrollUntilVisible:
    element:
      id: "acquisition-channel-walk_in"
    direction: DOWN
# A tap while the scroll still moves is lost.
- waitForAnimationToEnd
- tapOn:
    id: "acquisition-channel-walk_in"
- takeScreenshot: staff-new-client-1-form
- scrollUntilVisible:
    element:
      id: "new-client-submit"
    direction: DOWN
- tapOn:
    id: "new-client-submit"
- extendedWaitUntil:
    visible:
      id: "pending-card"
    timeout: 20000
- assertVisible: "Cuenta pendiente de activación"
# The phone typed without +591 is stored with it; FIX-037
# shows it after its flag.
- assertVisible: ".*\\+591 57007684 · .*"
- takeScreenshot: staff-new-client-2-pending
