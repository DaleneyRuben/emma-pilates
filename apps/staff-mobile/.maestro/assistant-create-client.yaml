# Critical journey: the Assistant creates a Client's account (S05) and lands
# on her overview with the invitation pending (S06). The email is new on
# every run (scripts/seed.js «new-client»), so the flow can repeat on the same
# database; each run leaves one more pending invitation.
appId: ${APP_ID}
env:
  EMAIL: camila.rojas@example.com
---
- runScript:
    file: scripts/seed.js
    env:
      SEED: new-client
- runFlow: subflows/login.yaml
- runFlow: subflows/park-dev-gear.yaml
- extendedWaitUntil:
    visible:
      id: "client-search-new-client"
    timeout: 30000
- tapOn:
    id: "client-search-new-client"
- extendedWaitUntil:
    visible:
      id: "new-client-name"
    timeout: 10000
- tapOn:
    id: "new-client-name"
- waitForAnimationToEnd
- inputText: "Paula Maestro"
# The phone pad has no return key: type the phone first and close the
# email keyboard with its return key, so it never covers «Crear cuenta».
- tapOn:
    id: "new-client-phone"
- waitForAnimationToEnd
- inputText: "70012345"
- tapOn:
    id: "new-client-email"
- waitForAnimationToEnd
- inputText: ${output.email}
- pressKey: Enter
# BKM-011: «¿Cómo nos conociste?» is required (follow-up 141).
- scrollUntilVisible:
    element:
      id: "acquisition-channel-walk_in"
    direction: DOWN
# A tap while the scroll still moves is lost.
- waitForAnimationToEnd
- tapOn:
    id: "acquisition-channel-walk_in"
- takeScreenshot: staff-new-client-1-form
- scrollUntilVisible:
    element:
      id: "new-client-submit"
    direction: DOWN
- tapOn:
    id: "new-client-submit"
- extendedWaitUntil:
    visible:
      id: "pending-card"
    timeout: 20000
- assertVisible: "Cuenta pendiente de activación"
- takeScreenshot: staff-new-client-2-pending
