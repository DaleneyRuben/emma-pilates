# Critical journey (IDN-009, ADR-0102): the Coordinator finds a Client, sees
# her overview with booking but no sale, and opens «Cancelar una clase» from
# her Horario tab (v2). Since FIX-040 her search offers «Nuevo cliente».
appId: ${APP_ID}
env:
  EMAIL: carolina.rivas@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- runFlow: subflows/park-dev-gear.yaml
- assertVisible:
    id: "client-search-new-client"
- takeScreenshot: staff-coordinator-search
- tapOn:
    id: "tab-schedule"
- tapOn:
    id: "schedule-cancel-class"
- extendedWaitUntil:
    visible: "Sucursal.*"
    timeout: 15000
- takeScreenshot: staff-coordinator-cancel-class
- tapOn:
    id: "back-bar"
- tapOn:
    id: "tab-clients"
- extendedWaitUntil:
    visible:
      id: "client-search-input"
    timeout: 15000
- tapOn:
    id: "client-search-input"
- inputText: "Lucía"
- extendedWaitUntil:
    visible:
      text: ".*Lucía Fernández.*"
    timeout: 15000
- tapOn:
    text: ".*Lucía Fernández.*"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Historial.*|Reservas.*"
    timeout: 15000
- assertVisible: "Reservar clase"
- assertNotVisible: "Registrar pago"
- takeScreenshot: staff-coordinator-overview
