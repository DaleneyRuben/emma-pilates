# NOT-002: the notification permission sheet («No te pierdas ninguna clase»)
# follows a booking, a Waitlist join, or a confirmed Evaluation in the Client
# app. The journeys do not test it (Test 46 does), so they answer «Ahora no»
# whenever it shows and carry on. The sheet's copy is per app (walkthrough
# n.º 16), so the subflow finds it by its test ids.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "push-permission-sheet"
    timeout: 5000
    optional: true
- tapOn:
    id: "push-permission-decline"
    optional: true
