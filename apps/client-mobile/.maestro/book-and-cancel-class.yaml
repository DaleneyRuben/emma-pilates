# Critical journey: browse Sessions, book one, see it in Mis reservas, cancel it.
# Needs a Client whose Plan is active with classes left and a scheduled
# Session in the fixtures' 30-day window: Lucía (5 of 8 classes left). Sofía's
# fixture Plan is expired, so her booking is refused and the flow fails on a
# fresh database. The booking is cancelled at the end, so the class goes back
# to her Plan.
appId: ${APP_ID}
env:
  EMAIL: lucia@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-booking"
    timeout: 30000
- tapOn:
    id: "tab-booking"
- extendedWaitUntil:
    visible:
      text: "Sucursal: .*"
    timeout: 20000
- runFlow:
    when:
      notVisible:
        text: ".*Pilates \\d\\d:\\d\\d.*"
    commands:
      - tapOn:
          text: "\\w{3} \\d{1,2}"
          index: 1
- extendedWaitUntil:
    visible:
      text: ".*Pilates \\d\\d:\\d\\d.*"
    timeout: 15000
- tapOn:
    text: ".*Pilates \\d\\d:\\d\\d.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "session-book"
    timeout: 15000
- tapOn:
    id: "session-book"
- runFlow: subflows/dismiss-push-permission.yaml
# «Reserva confirmada» lasts eight seconds and the notification sheet can
# outlast it on a slow emulator; the booking's «Cancelar» is the lasting proof.
- extendedWaitUntil:
    visible:
      id: "booking-cancel-.*"
    timeout: 30000
- takeScreenshot: client-booking-confirmed
- tapOn:
    id: "booking-cancel-.*"
- extendedWaitUntil:
    visible: "¿Cancelar esta reserva?"
    timeout: 10000
- tapOn:
    id: "booking-cancel-confirm"
- extendedWaitUntil:
    notVisible: "¿Cancelar esta reserva?"
    timeout: 10000
