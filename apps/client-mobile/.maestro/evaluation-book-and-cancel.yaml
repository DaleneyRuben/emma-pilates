# Critical journey: book an Evaluation from Perfil, see it confirmed, cancel it.
appId: ${APP_ID}
env:
  EMAIL: lucia@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Evaluación nutricional"
    timeout: 15000
- assertVisible: "Mis evaluaciones"
- takeScreenshot: client-evaluation-1-perfil
- tapOn: "Evaluación nutricional"
- extendedWaitUntil:
    visible: "Días disponibles"
    timeout: 15000
- assertVisible: "Nutricionista · sesiones de 45 min"
- assertVisible: "Puedes reservar hasta 3 horas antes."
- takeScreenshot: client-evaluation-2-disponibilidad
- tapOn:
    text: "Turno .*"
    index: 0
- extendedWaitUntil:
    visible: "Es gratuita — no usa clases de tu plan."
    timeout: 10000
- assertVisible: "Te avisaremos un día antes y una hora antes de tu cita."
- assertVisible: "Si necesitas cambiarla, puedes cancelarla desde Mis evaluaciones hasta 3 horas antes."
- takeScreenshot: client-evaluation-3-confirmar
- tapOn: "Confirmar"
- runFlow: subflows/dismiss-push-permission.yaml
# «Evaluación confirmada» lasts eight seconds and the notification sheet can
# outlast it on a slow emulator; the booked card's cancellation line is the
# lasting proof.
- extendedWaitUntil:
    visible: "Evaluación confirmada|Puedes cancelar hasta 3 horas antes."
    timeout: 15000
- assertVisible: "Puedes cancelar hasta 3 horas antes."
- takeScreenshot: client-evaluation-4-confirmada
- tapOn: "Cancelar"
- extendedWaitUntil:
    visible: "¿Cancelar esta evaluación?"
    timeout: 10000
# «este mes», or the month's name for next month's Evaluation (MOB-022).
- assertVisible: "Podrás reservar otra evaluación para .*"
- takeScreenshot: client-evaluation-5-cancelar
- tapOn: "Sí, cancelar evaluación"
- extendedWaitUntil:
    visible: "No tienes evaluaciones próximas."
    timeout: 15000
- takeScreenshot: client-evaluation-6-vacio
- extendedWaitUntil:
    notVisible: "¿Cancelar esta evaluación?"
    timeout: 10000
- tapOn: "Reservar evaluación"
- extendedWaitUntil:
    visible: "Días disponibles"
    timeout: 15000
