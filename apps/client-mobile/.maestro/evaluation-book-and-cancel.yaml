# Critical journey (walkthrough finding 70, design follow-up 264): one
# «Evaluación nutricional» in Perfil. Lucía's 8-class Plan pays Bs 70: she
# books with the studio QR and a receipt, lands back on the same screen with
# her Evaluation on top «Pago en revisión», moves it, and cancels it, which
# a transfer still in review allows (finding 64). Leaves no booking behind.
# Needs the studio QR, the worker and one image in the photo library (Test 19).
appId: ${APP_ID}
env:
  EMAIL: lucia@example.com
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Evaluación nutricional"
    timeout: 15000
- assertNotVisible: "Mis evaluaciones"
- takeScreenshot: fix057-1-perfil
- tapOn: "Evaluación nutricional"
- extendedWaitUntil:
    visible: "Reserva tu evaluación"
    timeout: 15000
- assertVisible: "Días disponibles"
- assertVisible: "Puedes reservar hasta 3 horas antes."
- takeScreenshot: fix057-2-sin-reservar
- tapOn:
    text: "Turno .*"
    index: 0
- extendedWaitUntil:
    visible: "Cuesta Bs 70 · se paga por transferencia"
    timeout: 10000
- swipe:
    start: 50%,70%
    end: 50%,30%
- tapOn: "Sube tu comprobante de transferencia"
- runFlow: subflows/pick-first-photo.yaml
- extendedWaitUntil:
    visible: "El estudio revisa tu pago y te avisa por la app"
    timeout: 60000
- tapOn: "Confirmar evaluación"
- runFlow: subflows/dismiss-push-permission.yaml
# The toast lasts eight seconds; the card on top is the lasting proof.
- extendedWaitUntil:
    visible:
      id: "next-evaluation"
    timeout: 15000
# C5 pick C: the appointment block names the price and state, the actions sit
# inside it.
- assertVisible: ".*Pago en revisión · llega 10 min antes"
- assertVisible: "El estudio revisa tu comprobante de Bs 70 y te avisa por la app."
- takeScreenshot: fix057-3-pago-en-revision
- tapOn: "Cambiar fecha"
- extendedWaitUntil:
    visible: "Elige el nuevo horario"
    timeout: 10000
- assertVisible: "Cambias tu cita del .*"
- takeScreenshot: fix057-4-elige-nuevo-horario
# On a phone the turnos sit below the card: bring them up before tapping.
- swipe:
    start: 50%,70%
    end: 50%,30%
- tapOn:
    text: "Turno .*"
    index: 0
- extendedWaitUntil:
    visible: "Sí, mover evaluación"
    timeout: 10000
- tapOn: "Sí, mover evaluación"
- extendedWaitUntil:
    visible: "Evaluación reprogramada"
    timeout: 15000
- assertNotVisible: "Elige el nuevo horario"
- takeScreenshot: fix057-5-reprogramada
- tapOn: "Cancelar evaluación"
- extendedWaitUntil:
    visible: "¿Cancelar esta evaluación?"
    timeout: 10000
- tapOn: "Sí, cancelar evaluación"
- extendedWaitUntil:
    visible: "Reserva tu evaluación"
    timeout: 15000
- assertNotVisible:
    id: "next-evaluation"
- takeScreenshot: fix057-6-cancelada
