# Critical journey: the Promotions carousel, Home shortcuts, Mi plan, and
# notification destinations. Needs the two Promotions of Test 33 published
# (or pass -e PROMOTION_1=... -e PROMOTION_2=... with the headlines on screen).
appId: ${APP_ID}
env:
  EMAIL: lucia@example.com
  PROMOTION_1: "Nueva sala de Reformer en Urubó"
  PROMOTION_2: "Clases de Barre los sábados"
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: ${PROMOTION_1}
    timeout: 30000
- assertVisible: "Novedades del estudio"
- assertVisible: "Promoción 1 de 2"
- takeScreenshot: client-home-1-inicio
- swipe:
    start: "80%,25%"
    end: "10%,25%"
- extendedWaitUntil:
    visible: ${PROMOTION_2}
    timeout: 10000
- assertVisible: "Promoción 2 de 2"
- takeScreenshot: client-home-1b-promocion-2
# The carousel takes the top of the phone screen; the quick actions sit below.
- swipe:
    start: "50%,75%"
    end: "50%,25%"
- extendedWaitUntil:
    visible:
      text: "Evaluación nutricional: .*"
    timeout: 10000
- assertVisible:
    text: "Mis referidos: .*"
- takeScreenshot: client-home-1c-accesos
- tapOn:
    text: "Mis referidos: .*"
- extendedWaitUntil:
    visible: "Pronto podrás invitar a una amiga a una clase gratis."
    timeout: 15000
- takeScreenshot: client-home-2-referidos
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Ver detalle"
    timeout: 10000
- tapOn: "Ver detalle"
- extendedWaitUntil:
    visible: "Suscripción actual"
    timeout: 10000
- assertVisible: "Podrás comprar un plan nuevo cuando este termine."
- takeScreenshot: client-home-3-miplan
- tapOn: "Volver"
- tapOn:
    text: "Evaluación nutricional: .*"
- extendedWaitUntil:
    visible: "Días disponibles|Mis evaluaciones"
    timeout: 15000
- takeScreenshot: client-home-4-evaluacion
- tapOn:
    id: "tab-profile"
# «Cerrar sesión» sits below the fold since follow-up 103.
- extendedWaitUntil:
    visible: "Cambiar contraseña"
    timeout: 15000
- tapOn:
    text: "Notificaciones.*"
- extendedWaitUntil:
    visible:
      text: ".*canceló tu evaluación nutricional.*"
    timeout: 15000
- takeScreenshot: client-home-5-inbox
- tapOn:
    text: ".*canceló tu evaluación nutricional.*"
- extendedWaitUntil:
    visible: "Mis evaluaciones"
    timeout: 10000
- takeScreenshot: client-home-6-mis-evaluaciones
- tapOn: "Volver"
- extendedWaitUntil:
    visible:
      text: ".*Tu clase de .* fue cancelada.*"
    timeout: 10000
- tapOn:
    text: ".*Tu clase de .* fue cancelada.*"
- extendedWaitUntil:
    visible: "Ver historial"
    timeout: 10000
- takeScreenshot: client-home-7-mis-reservas
