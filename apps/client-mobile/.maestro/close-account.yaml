# Critical journey: close the Client's own Account from Perfil (BE-007,
# prompt 24). It is permanent, so run it against a disposable copy of the
# fixtures (Test 35), never the database you keep.
appId: ${APP_ID}
env:
  EMAIL: sofia@example.com
---
- runFlow: subflows/login.yaml
- tapOn:
    id: "tab-profile"
# Since follow-up 103 the promotions card pushes «Cerrar sesión» below the
# fold on a phone, so wait for the menu's last row.
- extendedWaitUntil:
    visible: "Cambiar contraseña"
    timeout: 15000
# The link sits under «Cerrar sesión», below the fold on a phone.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
- takeScreenshot: client-close-1-perfil
- tapOn: "Cerrar mi cuenta"
- extendedWaitUntil:
    visible: ".*Esto es lo que va a pasar.*"
    timeout: 15000
# PAY-005: Credit is retired, so no consequence mentions it.
- assertNotVisible: ".*crédito.*"
- assertVisible: "Cerramos tu sesión en todos tus dispositivos."
- takeScreenshot: client-close-2-consecuencias
# On a phone the password field sits under the pinned footer: scroll the
# consequences up before typing.
- swipe:
    start: "50%,55%"
    end: "50%,25%"
# BE-021 (ADR-0097): the erasure note and the unticked promotions box.
- assertVisible: "Borramos tu nombre, correo, teléfono y foto.*"
- tapOn: "Quiero seguir recibiendo promociones de Emma Pilates"
- takeScreenshot: client-close-3-promociones
- tapOn: "Tu contraseña"
- inputText: ${PASSWORD}
- takeScreenshot: client-close-4-contrasena
- tapOn:
    id: "close-account-confirm"
- extendedWaitUntil:
    visible: "Cerramos tu cuenta. Gracias por entrenar con nosotras."
    timeout: 15000
- assertVisible: "Iniciar sesión"
- takeScreenshot: client-close-5-cerrada
