      <button type="button" style="align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #93615D; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">¿Olvidaste tu contraseña?</button>

      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{centered}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: {{cJustify}}; gap: 20px; padding: {{cPad}}; box-sizing: border-box; overflow: hidden">
      <sc-if value="{{cLogo}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 14px"><img src="./emma-logo.png" alt="Emma Pilates Studio" style="width: {{logoW}}px; height: auto; display: block"><sc-if value="{{staff}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; min-height: 26px; padding: 3px 12px; border-radius: 999px; background: #FFFBFB; font-size: 12px; font-weight: 700; line-height: 1.2; letter-spacing: .12em; text-transform: uppercase">Acceso del equipo</span></sc-if></div></sc-if>

          <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600; line-height: 1.45">Correo electrónico</span><input type="email" autocomplete="email" value="{{email}}" onChange="{{typeEmail}}" onFocus="{{openKb}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFBFB; box-shadow: inset 0 0 0 1.5px #CDA697; font-family: 'Work Sans', sans-serif; font-size: 16px; color: #93615D"></label>

          <button type="button" style="height: 52px; margin-top: 4px; border: 0; border-radius: 16px; background: #93615D; color: #FFFBFB; font-family: 'Work Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">Iniciar sesión</button>

        </div>
        <sc-if value="{{client}}" hint-placeholder-val="{{true}}">
          <div style="background: #FFFBFB; border-radius: 20px; padding: 6px 14px; display: flex; justify-content: center; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(147,97,93,.08), 0 4px 14px rgba(147,97,93,.10)"><span style="font-size: 15px; line-height: 1.5">¿No tienes una cuenta?</span><button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #93615D; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Regístrate</button></div>

      <div style="flex: 1; display: grid; place-items: center; color: #6B6E75; font-family: -apple-system, system-ui, sans-serif; font-size: 14px">Teclado</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var V = 'A';
var APP = 'clientas';
var IPAD = false;
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var kb = !!st.kb;
    var sheet = V !== 'C';
    var staff = APP === 'equipo';
    var logoW = sheet ? (kb ? (IPAD ? 220 : 150) : (IPAD ? 380 : 270)) : (kb ? (IPAD ? 200 : 130) : (IPAD ? 300 : 230));
    return {
      w: IPAD ? 834 : 390, h: IPAD ? 1194 : 844,
      bg: sheet ? '#E7CCBF' : '#F9E7DF',
      sheet: sheet, centered: !sheet, logo: V === 'A', title: V === 'B',
      staff: staff, client: !staff,
      logoW: logoW, titleSize: IPAD ? 40 : (kb ? 26 : 30),
      heroPad: IPAD ? '64px 40px 32px' : (kb ? '50px 24px 12px' : '58px 24px 24px'),
      sheetMax: IPAD ? 560 : 1000, sheetPadX: IPAD ? 40 : 24, sheetPadB: kb ? 16 : (IPAD ? 40 : 42),
      cLogo: !(kb && !IPAD), cJustify: kb ? 'flex-end' : 'center',
      cPad: kb ? '50px 16px 12px' : (IPAD ? '64px 40px 40px' : '58px 16px 42px'),
      kb: kb, kbH: IPAD ? 398 : 336,
      email: st.email || '', password: st.password || '',
      pwType: st.show ? 'text' : 'password', eyeLabel: st.show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      typeEmail: function (e) { self.setState({ email: e.target.value }); },
      typePassword: function (e) { self.setState({ password: e.target.value }); },
      toggleEye: function () { self.setState({ show: !st.show }); },
      openKb: function () { self.setState({ kb: true }); },
      closeKb: function () { self.setState({ kb: false }); }
    };
  }
}
</script>
