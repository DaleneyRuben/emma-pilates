<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar tu código</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7D4F4B}a:hover{color:#5E3B38}
input:focus{outline:none;border-color:#93615D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; color: #4A4A4A; font-family: 'Work Sans', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 8px 4px; display: flex; align-items: center; gap: 4px">
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="1.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></span>
    <span style="font-size: 16px; font-weight: 500">Invita a una amiga</span>
  </div>
  <div style="padding: 8px 20px 0">
    <div style="background: #93615D; border-radius: 20px; padding: 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.75)">Tu código</span>
      <span style="font-family: Lora, Georgia, serif; font-size: 32px; line-height: 1.1; letter-spacing: 0.12em">LUCIA</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(74,74,74,0.45)"></div>

  <div role="dialog" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FAF7F2; border-radius: 24px 24px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: #E6DBD0; align-self: center"></div>
    <span id="sheet-title" style="font-family: Lora, Georgia, serif; font-size: 24px">Editar tu código</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="code" style="font-size: 14px; font-weight: 500">Tu nuevo código</label>
      <input id="code" type="text" value="{{code}}" onChange="{{onType}}" maxlength="20" autocapitalize="characters" autocomplete="off" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #E6DBD0; border-radius: 14px; background: #FFFFFF; color: #4A4A4A; font-family: Lora, Georgia, serif; font-size: 22px; letter-spacing: 0.12em">
      <span style="{{statusStyle}}">{{statusText}}</span>
    </div>
    <span style="font-size: 13px; color: #6F6662">Usa de 3 a 20 letras, números o guiones. Puedes cambiarlo una vez cada 30 días.</span>
    <sc-if value="{{canSave}}" hint-placeholder-val="{{ true }}">
      <a href="C16e-Confirmar-codigo.dc.html" style="height: 52px; border-radius: 14px; background: #93615D; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Guardar código</a>
    </sc-if>
    <sc-if value="{{cannotSave}}" hint-placeholder-val="{{ false }}">
      <span aria-disabled="true" style="height: 52px; border-radius: 14px; background: #E6DBD0; color: #6F6662; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Guardar código</span>
    </sc-if>
    <a href="C16-Invita-a-una-amiga.dc.html" style="height: 44px; color: #93615D; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Cancelar</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: 'LU-PILATES' };
  }
  status(code) {
    const taken = ['SOFIA', 'MARIANA', 'CAMILA', 'VALERIA', 'ISABEL', 'DANIELA'];
    const reserved = ['EMMA', 'ADMIN', 'SOPORTE', 'ESTUDIO', 'STUDIO', 'PILATES', 'OFICIAL'];
    const insults = ['PUTA', 'PUTO', 'MIERDA', 'CARAJO', 'IDIOTA', 'CULO'];
    const letters = code.replace(/[^A-Z]/g, '');
    if (code === 'LUCIA') return { kind: 'current', text: 'Es tu código actual' };
    if (!/^[A-Z0-9][A-Z0-9-]{2,19}$/.test(code)) return { kind: 'error', text: 'Usa de 3 a 20 letras, números o guiones' };
    if (reserved.some((w) => letters.startsWith(w)) || insults.some((w) => letters.includes(w))) return { kind: 'error', text: 'Ese código no está permitido' };
    if (taken.includes(code)) return { kind: 'error', text: 'Ya está en uso' };
    return { kind: 'ok', text: 'Disponible' };
  }
  renderVals() {
    const code = this.state.code;
    const s = this.status(code);
    const color = s.kind === 'ok' ? '#3F7A55' : s.kind === 'error' ? '#A04E3E' : '#6F6662';
    return {
      code,
      onType: (e) => this.setState({ code: e.target.value.toUpperCase().replace(/\s/g, '') }),
      statusText: s.kind === 'ok' ? '✓ Disponible' : s.text,
      statusStyle: 'font-size: 14px; font-weight: 600; color: ' + color,
      canSave: s.kind === 'ok',
      cannotSave: s.kind !== 'ok',
    };
  }
}
</script>
</body>
</html>
