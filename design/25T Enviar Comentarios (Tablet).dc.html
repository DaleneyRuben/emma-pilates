<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Enviar comentarios · tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap"><style>body{margin:0}a{color:#93615D}a:hover{color:#93615D}textarea:focus{outline:none}</style></helmet>
<div style="width: 834px; height: 1194px; position: relative; overflow: hidden; background: #F9E7DF; font-family: 'Work Sans', sans-serif; color: #93615D">
  <div style="background: #E7CCBF; padding: 56px 40px 24px; border-radius: 0 0 28px 28px; display: flex; align-items: center; gap: 16px">
    <a href="18T%20Perfil%20%28Tablet%29.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFBFB; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93615D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: Lora, serif; font-weight: 500; font-size: 36px; line-height: 1.1">Enviar comentarios</h1>
  </div>
  <div style="width: 560px; margin: 0 auto; padding-top: 32px; display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 16px; line-height: 1.5">Cuéntanos qué falló o qué mejorarías. Lo lee el equipo de Emma Pilates Studio.</span>
    <div style="background: #FFFBFB; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(147,97,93,.08), 0 4px 14px rgba(147,97,93,.10)">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase">Tipo</span>
      <div role="radiogroup" aria-label="Tipo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{k.checked}}" onClick="{{k.pick}}" style="height: 44px; border: 0; border-radius: 999px; background: {{k.bg}}; color: {{k.fg}}; box-shadow: {{k.ring}}; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">{{k.name}}</button>
        </sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">Comentario</span><textarea rows="6" style="box-sizing: border-box; padding: 12px 14px; border: 0; border-radius: 14px; background: #FFFBFB; box-shadow: inset 0 0 0 1.5px #CDA697; font-family: 'Work Sans', sans-serif; font-size: 16px; line-height: 1.5; color: #93615D; resize: none">Me gustaría poder ver la lista de espera desde Inicio.</textarea><span style="display: flex; justify-content: space-between; font-size: 13px"><span>Mínimo 10 caracteres.</span><span>54 / 2000</span></span></label>
    </div>
    <a href="18T%20Perfil%20%28Tablet%29.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #93615D; color: #FFFBFB; font-size: 16px; font-weight: 700; text-decoration: none">Enviar comentario</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var sel = (this.state || {}).sel || 'Sugerencia';
    return {
      kinds: ['Problema', 'Sugerencia', 'Otro'].map(function (n) {
        var on = n === sel;
        return { name: n, checked: on ? 'true' : 'false', bg: on ? '#93615D' : '#FFFBFB', fg: on ? '#FFFBFB' : '#93615D', ring: on ? 'none' : 'inset 0 0 0 1.5px #CDA697', pick: function () { self.setState({ sel: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
