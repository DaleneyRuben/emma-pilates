<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión · tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap"><style>body{margin:0}a{color:#93615D}a:hover{color:#93615D}input:focus{outline:none}</style></helmet>
<div style="width: 834px; height: 1194px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #E7CCBF; font-family: 'Work Sans', sans-serif; color: #93615D">
  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 64px 40px 32px; box-sizing: border-box; overflow: hidden">
    <img src="./emma-logo.png" alt="Emma Pilates Studio" style="width: {{logoW}}px; height: auto; display: block">
  </div>
  <div style="flex: none; align-self: center; width: 560px; box-sizing: border-box; background: #FFFBFB; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 32px rgba(147,97,93,.25); padding: 32px 40px {{sheetPadB}}px; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600; line-height: 1.45">Correo electrónico</span><input type="email" autocomplete="email" value="{{email}}" onChange="{{typeEmail}}" onFocus="{{openKb}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFBFB; box-shadow: inset 0 0 0 1.5px #CDA697; font-family: 'Work Sans', sans-serif; font-size: 16px; color: #93615D"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600; line-height: 1.45">Contraseña</span><span style="display: flex; align-items: center; height: 52px; box-sizing: border-box; padding: 0 4px 0 14px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px #CDA697"><input type="{{pwType}}" autocomplete="current-password" value="{{password}}" onChange="{{typePassword}}" onFocus="{{openKb}}" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; font-family: 'Work Sans', sans-serif; font-size: 16px; color: #93615D"><button type="button" aria-label="{{eyeLabel}}" onClick="{{toggleEye}}" style="width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: #93615D; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
    <a href="02T%20Inicio%20%28Tablet%29.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 4px; border-radius: 16px; background: #93615D; color: #FFFBFB; font-size: 16px; font-weight: 700; text-decoration: none">Iniciar sesión</a>
    <a href="20T%20Recuperar%20Contrase%C3%B1a%20%28Tablet%29.dc.html" style="align-self: center; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; color: #93615D; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">¿Olvidaste tu contraseña?</a>
    <div style="display: flex; justify-content: center; align-items: center; gap: 6px; padding-top: 12px; border-top: 1px solid #F3DDD3"><span style="font-size: 15px; line-height: 1.5">¿No tienes una cuenta?</span><button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #93615D; font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Regístrate</button></div>
  </div>
  <sc-if value="{{kb}}" hint-placeholder-val="{{false}}">
    <div style="flex: none; height: 398px; display: flex; flex-direction: column; background: #D1D4DA">
      <div style="display: flex; justify-content: flex-end; padding: 4px 8px; background: #F1F1F3"><button type="button" onClick="{{closeKb}}" style="min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: #0A63D6; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Listo</button></div>
      <div style="flex: 1; display: grid; place-items: center; color: #6B6E75; font-family: -apple-system, system-ui, sans-serif; font-size: 14px">Teclado</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var kb = !!st.kb;
    return {
      kb: kb,
      logoW: kb ? 220 : 380,
      sheetPadB: kb ? 16 : 40,
      email: st.email || '', password: st.password || '',
      pwType: st.show ? 'text' : 'password', eyeLabel: st.show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      typeEmail: function (e) { self.setState({ email: e.target.value }); },
      typePassword: function (e) { self.setState({ password: e.target.value }); },
      toggleEye: function () { self.setState({ show: !st.show }); },
      openKb: function () { self.setState({ kb: true }); },
      closeKb: function () { self.setState({ kb: false }); }
    };
  }
}
</script>
</body>
</html>
