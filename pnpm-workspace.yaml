packages:
  - apps/*
  - packages/*

overrides:
  zod: 4.6.7
  multer: 2.5.0
  body-parser: 2.4.0
  # GHSA-97r2-qh9m-474h, GHSA-wp97-x4hv-qvhp, GHSA-7rv5-mrxv-xcr9: seroval
  # <=1.6.7 via @tanstack/router-core. 1.6.8 is published; the router still
  # resolves 1.6.7, so the pin stays until a router release takes it.
  seroval: 1.6.8

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": false
  "@prisma/engines": true
  "@scarf/scarf": false
  "@sentry/cli": true
  "@swc/core": false
  argon2: true
  cpu-features: false
  esbuild: true
  msw: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

# EXT-019: `pnpm audit --audit-level high` runs in CI; advisories whose fix is
# not published yet are ignored here, each with its reason in
# docs/architecture/infrastructure.md («Dependency audit»), and reviewed
# when the next audit run or Dependabot pull request names them.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3 via jest: 3.0.4 is not on npm
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0 via expo: 1.4.1 is not on npm
    - GHSA-2883-xcg3-v3hh # js-yaml 4.3.1 pinned by orval 8.26.0; upgrading orval regenerates the client
