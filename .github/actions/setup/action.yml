name: setup
description: Node from .nvmrc, pnpm from the packageManager field, cached pnpm store, frozen install, generated Prisma client

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm --filter @pilates/backend prisma:generate
      shell: bash
