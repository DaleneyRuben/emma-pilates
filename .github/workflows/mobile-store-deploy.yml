name: Store deploy

# REL-008 (ADR-0101, amending ADR-0038). Manual only, and only from a
# release/* branch. Android submits to Play's internal track; iOS uploads to
# App Store Connect, where the build lands in TestFlight. Nothing here
# promotes a track to production or sends a build to App Review. iOS needs
# the owner's one-time credential setup on EAS first (mobile-release runbook,
# "iOS: first TestFlight build").
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build and submit
        required: true
        type: choice
        options: [client, staff]
      platform:
        description: android (Play internal testing) or ios (TestFlight)
        required: true
        type: choice
        options: [android, ios]

permissions:
  contents: read

concurrency:
  group: mobile-store-${{ inputs.app }}-${{ inputs.platform }}
  cancel-in-progress: false

# eas-cli is no dependency of the apps, so the workflow runs one pinned
# version through npx. Raise it here, in both mobile workflows.
env:
  EAS_CLI_VERSION: 27.2.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Refuse a branch that is not a release branch
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "Store deploy runs from a release/<app>-x.y.z branch (ADR-0101)."
          exit 1

      - name: Stop until the owner stores EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Create an Expo robot user for emma-pilates and store its token as the EXPO_TOKEN GitHub secret. This workflow builds nothing until then."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stop until the iOS submit profile names the App Store Connect app
        if: inputs.platform == 'ios'
        working-directory: apps/${{ inputs.app }}-mobile
        run: |
          if ! node -e 'process.exit(require("./eas.json").submit?.production?.ios?.ascAppId ? 0 : 1)'; then
            echo "eas.json has no submit.production.ios.ascAppId. A non-interactive submit cannot look up the App Store Connect app without it; add the app's numeric Apple ID (App Store Connect, App Information, Apple ID)."
            exit 1
          fi

      # Android goes to Play's internal track. iOS goes to App Store Connect
      # and shows up in TestFlight; it reads the distribution certificate,
      # provisioning profile, push key, and App Store Connect API key the
      # owner stored on EAS, and the submit profile's ascAppId (checked above).
      - name: Build and submit to internal testing
        working-directory: apps/${{ inputs.app }}-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: npx --yes eas-cli@"$EAS_CLI_VERSION" build --profile production --platform "$PLATFORM" --auto-submit --non-interactive --no-wait
