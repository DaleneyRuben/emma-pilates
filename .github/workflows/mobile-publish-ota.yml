name: Publish OTA

# REL-008 (ADR-0101, amending ADR-0039). Manual only. A push to main never
# publishes an update. The workflow stops before any Expo call when the
# EXPO_TOKEN secret is absent; creating that robot token is an owner action.
# FIX-011: the preview gate publishes to the staging channel (testers use
# staging builds; there is no preview channel), git notes are fetched and
# appended so both apps can mark the same commit, and the message/rollout
# pass through env so shell never interpolates workflow inputs.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app receives the update
        required: true
        type: choice
        options: [client, staff, both]
      channel:
        description: preview first (publishes to staging); production only after a preview of this same commit
        required: true
        type: choice
        options: [preview, production]
      message:
        description: Update message testers and the operator will see
        required: true
        type: string
      rollout_percentage:
        description: Production rollout percentage (1-100). Preview ignores it.
        required: true
        default: "10"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-ota-${{ inputs.app }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse a dispatch that is not on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "OTA publishes only from main (ADR-0039)."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      # The first preview creates the notes ref; until then there is none.
      - name: Fetch git notes for the production guard
        run: git fetch origin '+refs/notes/commits:refs/notes/commits' || echo "No git notes yet."

      - name: Require a green CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "${{ github.sha }}" --branch main --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" = "0" ]; then
            echo "No successful CI run for ${{ github.sha }} on main."
            exit 1
          fi

      - name: Stop until the owner stores EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Create an Expo robot user for emma-pilates and store its token as the EXPO_TOKEN GitHub secret. This workflow publishes nothing until then."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_APP: ${{ inputs.app }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_MESSAGE: ${{ inputs.message }}
          OTA_ROLLOUT: ${{ inputs.rollout_percentage }}
          OTA_SHA: ${{ github.sha }}
        run: |
          apps=()
          case "$OTA_APP" in
            client) apps=(client-mobile) ;;
            staff) apps=(staff-mobile) ;;
            both) apps=(client-mobile staff-mobile) ;;
          esac
          for app in "${apps[@]}"; do
            if [ "$OTA_CHANNEL" = "production" ]; then
              node scripts/mobile-ota-guard.mjs "$app" "$OTA_SHA"
              cd "apps/$app"
              pnpm exec eas update --channel production --environment production --message "$OTA_MESSAGE" --rollout-percentage "$OTA_ROLLOUT" --non-interactive
              cd ../..
            else
              cd "apps/$app"
              # The staging builds are the staging variant (eas.json), which
              # changes the fingerprint: publish for that runtime.
              APP_VARIANT=staging pnpm exec eas update --channel staging --environment preview --message "$OTA_MESSAGE" --non-interactive
              cd ../..
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" notes append -m "preview-ota:${app}:${OTA_SHA}" "$OTA_SHA"
              git push origin refs/notes/commits
            fi
          done
