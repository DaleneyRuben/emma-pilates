name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces its run; a push to main never does,
# because Release Staging waits for CI on that exact commit (EXT-019).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # prisma.config.ts and the environment schema the OpenAPI generator validates
  # need DATABASE_URL to exist; nothing in CI connects to it. The integration
  # suite overrides it per disposable database through TEST_DATABASE_URL.
  DATABASE_URL: postgresql://nobody@127.0.0.1:1/pilates_ci_unreachable

jobs:
  # A pull request runs only the chains of the surfaces it touches; the
  # generated client in packages/api-contracts is shared by all three. A push
  # to main always runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' || steps.filter.outputs.workflow == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' || steps.filter.outputs.workflow == 'true' }}
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.workflow == 'true' }}
      public: ${{ github.event_name != 'pull_request' || steps.filter.outputs.public == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - .github/**
            api:
              - *shared
              - apps/backend/**
              - packages/api-contracts/**
            web:
              - *shared
              - apps/admin-web/**
              - packages/api-contracts/**
            mobile:
              - *shared
              - apps/client-mobile/**
              - apps/staff-mobile/**
              - packages/mobile-core/**
              - packages/tooling/**
              - packages/api-contracts/**
            public:
              - .github/**
              - apps/public-site/**
            workflow:
              - .github/workflows/ci.yml

  # EXT-019: the security checks. Each runs on every pull request and push,
  # because an advisory or a leaked value is not tied to a surface.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # reads pnpm-lock.yaml only, so no install; high and critical
      # advisories fail, in every dependency (the development tooling runs
      # here with the repository's secrets). Advisories without a published
      # fix are listed in package.json pnpm.auditConfig.ignoreGhsas with
      # their reason in docs/architecture/infrastructure.md
      - run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the pull request's commits (or the pushed ones) against the default
      # rules and the allowlists in .gitleaks.toml; findings go to the job
      # summary, redacted, never to a pull request comment
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # the migrations applied to an empty PostgreSQL must produce the Prisma
  # schema, up to the raw constraints listed in apps/backend/prisma/known-drift.sql
  migrations:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/scripts/check-migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # the public pages have no build (WEB-021), so this is their only check
  public-site:
    needs: changes
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/check-public-site.mjs

  quality-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pilates/backend lint
      - run: pnpm --filter @pilates/backend format:check
      - run: pnpm --filter @pilates/backend typecheck
      - run: pnpm --filter @pilates/backend build
      - run: pnpm --filter @pilates/api-contracts typecheck
      - run: pnpm --filter @pilates/api-contracts build

  quality-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pilates/admin-web lint
      - run: pnpm --filter @pilates/admin-web format:check
      - run: pnpm --filter @pilates/admin-web typecheck
      - run: pnpm --filter @pilates/admin-web build

  quality-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pilates/tooling lint
      - run: pnpm --filter @pilates/mobile-core lint
      - run: pnpm --filter @pilates/mobile-core format:check
      - run: pnpm --filter @pilates/mobile-core typecheck
      - run: pnpm --filter @pilates/client-mobile lint
      - run: pnpm --filter @pilates/client-mobile format:check
      - run: pnpm --filter @pilates/client-mobile typecheck
      - run: pnpm --filter @pilates/staff-mobile lint
      - run: pnpm --filter @pilates/staff-mobile format:check
      - run: pnpm --filter @pilates/staff-mobile typecheck

  contracts:
    needs: quality-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:api
      - run: pnpm check:api-compat

  # one job per test level (EXT-005): a job carries only what its level needs,
  # so the unit and e2e suites run without a database and the two database
  # suites run side by side
  api-unit:
    needs: quality-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pilates/backend test

  # the supertest suites boot the application without a database
  api-e2e:
    needs: [contracts, api-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @pilates/backend test:e2e

  # the Prisma repositories and PostgreSQL behaviour on a service container;
  # the suite runs through TEST_DATABASE_URL on a pilates_test_ci admin
  # database that lives and dies with the runner; the S3 adapter runs against
  # S3Mock (ADR-0088). The critical path of the workflow, so it starts right
  # after quality-api and splits its spec files across shards, each with its
  # own runner, PostgreSQL, and S3Mock (EXT-022, EXT-023); nothing names the
  # check, so the shards report on their own
  api-integration:
    name: api-integration (${{ matrix.shard }}/6)
    needs: quality-api
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: pilates-test
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database pilates_test_ci'
      # Jest's --shard groups by sorted path, which put the slow files in
      # shards 1 and 6 (2m 53s and 3m 03s on run 40238852703). The pattern
      # spreads the measured files instead.
      - run: pnpm --filter @pilates/backend test:integration --testPathPattern="$(node scripts/print-integration-shard.mjs ${{ matrix.shard }})"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilates_test_ci
          OBJECT_STORAGE_TEST_ENDPOINT: http://localhost:9090
          OBJECT_STORAGE_TEST_ACCESS_KEY_ID: s3mock
          OBJECT_STORAGE_TEST_SECRET_ACCESS_KEY: s3mock
          # the in-band ESM run grows past Node's default heap on the runner
          NODE_OPTIONS: --max-old-space-size=4096

  # s3-backup-store alone took 30 s of the 218 s test step on shard 2/3
  # (run 40238092203), so it runs beside the six shards instead of landing
  # in one of them
  api-integration-backup:
    name: api-integration (backup)
    needs: quality-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: pilates-test
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database pilates_test_ci'
      - run: pnpm --filter @pilates/backend test:integration s3-backup-store
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilates_test_ci
          OBJECT_STORAGE_TEST_ENDPOINT: http://localhost:9090
          OBJECT_STORAGE_TEST_ACCESS_KEY_ID: s3mock
          OBJECT_STORAGE_TEST_SECRET_ACCESS_KEY: s3mock
          NODE_OPTIONS: --max-old-space-size=4096

  web-unit:
    needs: quality-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # the runner has two cores, so Jest runs the suite in band and every
      # handle a spec leaves behind holds the process; jest.environment.cjs
      # keeps React's scheduler off a Node MessagePort (WEB-016), and the
      # suite exits on its own
      - run: pnpm --filter @pilates/admin-web exec jest --ci

  # the ten Playwright journeys of Test 31 through the built backend and the
  # built admin web; the suite's global setup makes its own pilates_test_*
  # database and starts both servers. The journeys exercise the backend as
  # much as the admin web, so a backend-only pull request runs them too
  # (EXT-019), right after the paths filter
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright-browser: "true"
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database pilates_test_ci'
      - run: pnpm test:admin-e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilates_test_ci
      # the traces and screenshots of the failed journeys and both servers'
      # stderr (Test 31)
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-test-results
          path: apps/admin-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # one job per package: on run 40238092203 the three suites took 55 s,
  # 56 s, and 30 s one after another, plus 36 s of checkout and setup
  mobile-unit:
    name: mobile-unit (${{ matrix.package }})
    needs: quality-mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        package: ["@pilates/client-mobile", "@pilates/staff-mobile", "@pilates/mobile-core"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # the runner has two cores, so Jest runs the suite in band and every
      # timer a spec leaves behind holds the process; the package's
      # jest.setup.ts keeps TanStack's timers from doing so (MOB-057), and the
      # suite exits on its own
      - run: pnpm --filter ${{ matrix.package }} exec jest --ci
