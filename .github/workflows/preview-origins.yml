name: register preview origins

# WEB-019: trust each open pull request's admin preview on the shared
# development API (ADR-0084), and stop trusting it once the pull request closes.
on:
  deployment_status:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Runs queue rather than overlap; each recomputes the whole list.
concurrency:
  group: preview-origins
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Reconcile ADMIN_WEB_TRUSTED_ORIGINS on Render
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_SLUG: fernando-daleney-s-projects
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-db4ivt6i0phs73cru2p0
        run: .github/scripts/reconcile-preview-origins.sh
