name: Create native release

# REL-008 (ADR-0101, amending ADR-0038). Manual only. Opens a pull request
# that bumps one app's expo.version. The branch merges after that store
# version is published, because the appVersion runtime policy would otherwise
# stop OTA updates from reaching installed builds.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app gets the new version
        required: true
        type: choice
        options: [client, staff]
      bump:
        description: "patch: fixes (1.0.2 → 1.0.3). minor: something new people can use (→ 1.1.0). major: a redesign or a forced update (→ 2.0.0)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # The inputs reach the script through env:, never interpolated into it.
      # bump-expo-version.mjs computes the version from the current one.
      - name: Bump expo.version and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          BUMP: ${{ inputs.bump }}
        run: |
          folder="apps/${APP}-mobile"
          version="$(node scripts/bump-expo-version.mjs "$folder/app.json" "$BUMP")"
          branch="release/${APP}-${version}"
          git checkout -b "$branch"
          git add "$folder/app.json"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "bump the ${APP} app to ${version}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "release ${APP} ${version}" --body "Bumps ${folder} expo.version to ${version}. Merge only after this version is published in the stores. The appVersion runtime policy stops OTA updates from reaching installed builds of the previous version once this merges (ADR-0039, ADR-0101)."
          echo "Release branch ${branch} opened for ${APP} ${version}." >> "$GITHUB_STEP_SUMMARY"
