name: release production

# EXT-017 (ADR-0092): started by hand only. Promotes the commit staging runs
# (or the one named), refusing any commit whose release/staging status is not
# success and any commit behind or beside what production runs; then releases
# it to Northflank as EXT-008 did (migrate, api readiness, worker, backup
# image), smoke checks it, and deploys the admin web from the same commit to
# Vercel production with the Vercel CLI. The release tooling runs from main's
# head; only the deployed images and the admin web build use the commit.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit hash that passed staging (empty for the commit staging runs)
        required: false

permissions:
  contents: read
  actions: read
  statuses: read

# A running release is never cancelled mid-migration.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  # prisma generate in the setup action reads it; nothing connects to it
  DATABASE_URL: postgresql://nobody@127.0.0.1:1/pilates_ci_unreachable
  PRODUCTION_API_URL: https://p01--api--mmps25fn9k9x.code.run
  STAGING_API_URL: ${{ vars.STAGING_API_URL }}
  VERCEL_CLI: vercel@62.2.0

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.promotion.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup
      - name: Choose the commit to promote
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTE_SHA: ${{ inputs.sha }}
        run: pnpm --filter @pilates/backend promotion
      - name: Migrate, then release the API, the worker, and the backup image
        id: release
        env:
          RELEASE_ENVIRONMENT: production
          API_URL: ${{ env.PRODUCTION_API_URL }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: default
          NORTHFLANK_JOB_ID: migrate
          NORTHFLANK_SERVICE_ID: api
          NORTHFLANK_WORKER_SERVICE_ID: ${{ vars.NORTHFLANK_WORKER_SERVICE_ID }}
          NORTHFLANK_BACKUP_JOB_ID: ${{ vars.NORTHFLANK_BACKUP_JOB_ID }}
          RELEASE_SHA: ${{ steps.promotion.outputs.sha }}
        run: pnpm --filter @pilates/backend release
      - name: Smoke check the release
        env:
          SMOKE_BASE_URL: ${{ env.PRODUCTION_API_URL }}
          SMOKE_EXPECTED_RELEASE: ${{ steps.promotion.outputs.sha }}
        run: pnpm --filter @pilates/backend smoke

  admin-web:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The Vercel CLI reads these names; the secrets say they are production's
      # (staging's admin web deploys from Git and needs no token).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend.outputs.sha }}
      - uses: ./.github/actions/setup
      # The production project is disconnected from Git, so this is the only
      # way a commit reaches emma-pilates-admin.vercel.app.
      - name: Build the admin web for Vercel production
        run: |
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the prebuilt admin web to production
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
